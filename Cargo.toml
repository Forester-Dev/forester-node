[package]
name = "forester-node"
version = "2.3.1"
edition = "2024"
description = "Storage node for the Forester mesh"
license = "AGPL-3.0-only"
repository = "https://github.com/Forester-Dev/forester-node"
homepage = "https://share.forester.dev"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
fs4 = "1.1.0"
futures-util = "0.3.34"
hex = "0.4.3"
if-addrs = "0.15.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-roots = "1.0.11"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
